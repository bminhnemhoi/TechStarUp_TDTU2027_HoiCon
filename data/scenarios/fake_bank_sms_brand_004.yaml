id: fake_bank_sms_brand_004
category: fake_bank
is_benign: false
region: south
channel: sms_reported
script_vi: |
  Tin nhắn mang tên ngân hàng báo tài khoản bị tạm khóa kèm số điện thoại 'hỗ trợ'; bác gọi lại số trong tin
  nhắn và được hướng dẫn chuyển tiền sang 'tài khoản tạm'.
device_signals: {caller_flag: unknown, in_call: true, duration_bucket: 5_15m, app_category: bank}
elder_answers: {claims_authority: "yes", asks_transfer: "yes"}
