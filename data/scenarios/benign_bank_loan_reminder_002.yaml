id: benign_bank_loan_reminder_002
category: benign_bank
is_benign: true
twin_of: fake_bank_loan_limit_003
region: central
channel: phone_call
script_vi: |
  Ngân hàng gọi nhắc đến hạn trả khoản vay, đề nghị bác thanh toán qua ứng dụng chính thức hoặc tại quầy, không
  đưa số tài khoản lạ.
device_signals: {caller_flag: unknown, in_call: false, duration_bucket: 1_5m, app_category: bank}
elder_answers: {claims_authority: "yes", asks_transfer: "no"}
expected:
