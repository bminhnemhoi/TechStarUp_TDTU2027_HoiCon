id: recovery_scam_police_report_005
category: recovery_scam
is_benign: false
region: north
channel: phone_call
script_vi: |
  Người xưng nhân viên hỗ trợ nạn nhân (hư cấu) hẹn lập hồ sơ lấy lại tiền, yêu cầu nộp lệ phí giám định vào tài khoản trong ngày.
device_signals: {caller_flag: flagged, in_call: true, duration_bucket: 1_5m, app_category: bank}
