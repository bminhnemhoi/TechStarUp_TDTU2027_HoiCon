# Hạ tầng DEV của HỏiCon — chỉ Postgres 17 + pgvector (ADR-004). Cổng 15432 vì 5432 thuộc dự án khác.
#   docker compose -f infra/compose.dev.yml up -d
#   docker compose -f infra/compose.dev.yml stop
# Mật khẩu dưới đây chỉ dùng cho máy dev (chỉ bind 127.0.0.1), không phải bí mật. Prod dùng compose.prod.yml + secrets.
name: hoicon

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: hoicon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hoicon
      POSTGRES_PASSWORD: hoicon_dev
      POSTGRES_DB: hoicon
      TZ: UTC
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - hoicon_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoicon -d hoicon"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  hoicon_pgdata:
