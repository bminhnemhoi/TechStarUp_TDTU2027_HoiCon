# Cấu hình gitleaks cho HỏiCon: luật mặc định + luật riêng cho biến môi trường HOICON_* (token Zalo không nằm trong
# danh sách đối tác secret scanning của GitHub). Chạy tay: gitleaks git . --config .gitleaks.toml --redact
[extend]
useDefault = true

[[rules]]
id = "hoicon-env-secret"
description = "Biến bí mật HOICON_* có giá trị (chỉ được nằm trong backend/.env, không bao giờ commit)"
regex = '''HOICON_(?:ANTHROPIC_API_KEY|GEMINI_API_KEY|ZALO_BOT_TOKEN|ZALO_WEBHOOK_SECRET|PHONE_PEPPER_\d+)\s*=\s*([^\s#'"]{8,})'''
secretGroup = 1

# Test của init_env/check_keys cố ý dùng khóa GIẢ dạng HOICON_*=sk-fake… — chỉ miễn luật riêng này, luật mặc định
# của gitleaks vẫn quét thư mục test.
[[rules.allowlists]]
paths = ['''^backend/tests/''']
# Tài liệu hướng dẫn dùng placeholder `<khóa>`, `<token>` cho người làm — không phải giá trị thật.
regexes = ['''^<[^<>]+>''']

[allowlist]
description = "Mã nguồn công cụ và mẫu không chứa giá trị thật"
paths = [
  '''backend/\.env\.example$''',
  '''docs/schemas/fixtures/''',
]
# Trang /eval dùng `key: "<tên chỉ số>"` cho bảng đo — luật generic-api-key bắt nhầm tên chỉ số, không phải khóa.
regexes = ['''^(?:latency_p\d+_ms|cost_usd|cases_(?:total|scam|benign)|scam_detection_rate|escalation_recall|false_escalation_rate|safety_violations|ai_disclosure_rate|fallback_rate|consent_withdrawal_rate|case_file_completeness)$''']
