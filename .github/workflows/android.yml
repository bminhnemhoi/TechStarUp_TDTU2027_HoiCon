name: android

on:
  push:
    branches: [main]
    paths: ["apps/android/**", "docs/schemas/**", "data/bank_apps.vn.json", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", "docs/schemas/**", "data/bank_apps.vn.json", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      # :rules là JVM thuần — luật R0–R4 chạy ở đây mà không cần máy ảo.
      - run: ./gradlew --no-daemon :rules:test :app:assembleDebug :demobank:assembleDebug
