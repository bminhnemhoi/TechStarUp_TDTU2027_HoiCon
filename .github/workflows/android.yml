name: android

on:
  push:
    branches: [main]
    paths: ["apps/android/**", "docs/schemas/**", "data/bank_apps.vn.json", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", "docs/schemas/**", "data/bank_apps.vn.json", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: chmod +x gradlew
      # :rules là JVM thuần — luật R0–R4 chạy ở đây mà không cần máy ảo.
      # BankAppCatalogTest (trong :rules:test) bắt lệch giữa data/bank_apps.vn.json và mã sinh ra.
      # :latency chỉ build ở đây; chạy trên máy thật bằng scripts/ftl-latency.sh (Firebase Test Lab).
      - run: >-
          ./gradlew --no-daemon :rules:test :app:assembleDebug :app:processReleaseMainManifest
          :demobank:assembleDebug :latency:assembleDebug :app:lintDebug :demobank:lintDebug
      # Bản phát hành không được mang theo móc thử chỉ dành cho debug (ADR-008).
      - name: release manifest has no debug-only hooks
        run: |
          m=app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          ! grep -E "USE_FULL_SCREEN_INTENT|ScenarioReceiver" "$m"
