name: android

on:
  push:
    branches: [main]
    paths: ["apps/android/**", "docs/schemas/**", "data/bank_apps.vn.json", "design-system/**", "scripts/gen-design-tokens.py", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", "docs/schemas/**", "data/bank_apps.vn.json", "design-system/**", "scripts/gen-design-tokens.py", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: chmod +x gradlew
      # Mã sinh từ data/bank_apps.vn.json phải khớp từng byte (bắt cả sửa tay trong khối <queries>).
      - name: generated bank catalog is up to date
        run: python3 ../../scripts/gen-bank-apps.py && git diff --exit-code -- .
      # Tokens.kt và khối màu trong colors.xml sinh từ design-system/hoicon/tokens.json (spec 010); --check không ghi.
      - name: generated design tokens are up to date
        run: python3 ../../scripts/gen-design-tokens.py --check
      # :rules là JVM thuần — luật R0–R4 chạy ở đây mà không cần máy ảo.
      # BankAppCatalogTest (trong :rules:test) bắt lệch giữa data/bank_apps.vn.json và mã sinh ra.
      # :latency chỉ build ở đây; chạy trên máy thật bằng scripts/ftl-latency.sh (Firebase Test Lab).
      - run: >-
          ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" :rules:test :app:assembleDebug :app:processReleaseMainManifest
          :demobank:assembleDebug :latency:assembleDebug :app:lintDebug :demobank:lintDebug
      # Bản phát hành: không móc thử chỉ dành cho debug (ADR-008), không quyền bị cấm (CLAUDE.md luật 3) — kể cả
      # quyền do thư viện merge vào. So khớp thuộc tính, không so comment; thiếu file là lỗi (đường dẫn của AGP 9.4).
      - name: release manifest has no debug-only hooks or forbidden permissions
        run: |
          m=app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          test -s "$m" || { echo "::error::không thấy $m"; exit 1; }
          if grep -nE 'android:(name|permission)="(android\.permission\.(USE_FULL_SCREEN_INTENT|READ_SMS|RECEIVE_SMS|SEND_SMS|READ_CALL_LOG|WRITE_CALL_LOG|READ_CONTACTS|QUERY_ALL_PACKAGES|REQUEST_INSTALL_PACKAGES|REQUEST_IGNORE_BATTERY_OPTIMIZATIONS|BIND_ACCESSIBILITY_SERVICE|BIND_NOTIFICATION_LISTENER_SERVICE)|[^"]*\.ScenarioReceiver)"' "$m"; then exit 1; fi
