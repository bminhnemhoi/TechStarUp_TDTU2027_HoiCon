name: android

on:
  push:
    branches: [main]
    paths: ["apps/android/**", "docs/schemas/**", "data/bank_apps.vn.json", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", "docs/schemas/**", "data/bank_apps.vn.json", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: chmod +x gradlew
      # :rules là JVM thuần — luật R0–R4 chạy ở đây mà không cần máy ảo.
      - run: ./gradlew --no-daemon :rules:test :app:assembleDebug :demobank:assembleDebug
