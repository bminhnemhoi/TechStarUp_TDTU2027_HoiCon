name: secrets

# Quét bí mật trên MỌI push/PR (không lọc đường dẫn) — repo public. Binary gitleaks tải từ release chính thức và đối
# chiếu checksum (không dùng action bên thứ ba). Luật thêm: .gitleaks.toml (biến HOICON_* có giá trị).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # quét toàn bộ lịch sử
          persist-credentials: false
      - name: Cài gitleaks (đối chiếu checksum)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball" -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1
