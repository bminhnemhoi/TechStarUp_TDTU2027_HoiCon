name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "docs/schemas/**", "data/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docs/schemas/**", "data/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hoicon
          POSTGRES_PASSWORD: hoicon_ci
          POSTGRES_DB: hoicon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hoicon -d hoicon" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Spec 034: mặc định của ứng dụng là `prod`; CI chạy `test` tường minh (Zalo mock chỉ cho dev/test).
      HOICON_ENV: test
      HOICON_DATABASE_URL: postgresql+psycopg://hoicon:hoicon_ci@localhost:5432/hoicon
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      # Eval smoke tất định (spec 030): 20 ca, phản hồi LLM ghi sẵn, không khóa API, không mạng ngoài. Trượt ngưỡng
      # (recall/báo nhầm lệch > 3 điểm %, bất kỳ vi phạm an toàn, công khai AI < 100%) ⇒ job đỏ. DB service dùng chung
      # với pytest nên cần --shared-db-ok; eval chỉ chạm id/job `eval-*` và dọn sau lượt.
      - name: eval smoke
        run: uv run hoicon-eval --suite smoke --compare baseline --shared-db-ok
        env:
          HOICON_EVAL_DATABASE_URL: ${{ env.HOICON_DATABASE_URL }}
          # Spec 003: danh sách đe dọa trong DB là HMAC ⇒ runner cần khóa băm để nạp seed demo. Chuỗi cố định, CÔNG KHAI
          # (như khóa giả của tests/integration/conftest.py) — KHÔNG phải bí mật; CI không bao giờ có khóa thật.
          HOICON_PHONE_PEPPER_1: "1111111111111111111111111111111111111111111111111111111111111111"
