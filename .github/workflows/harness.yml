name: harness

on:
  push:
    branches: [main]
    paths: [".claude/**", ".github/workflows/harness.yml"]
  pull_request:
    paths: [".claude/**", ".github/workflows/harness.yml"]

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Hook guard-shell / guard-privacy / … (64 ca) — xem docs/HARNESS.md
      - run: node --test ".claude/hooks/test/*.test.mjs"
      - name: settings.json còn đủ 7 hook (claude plugin install từng xóa mất args)
        run: |
          node -e "const s=require('./.claude/settings.json');const n=Object.values(s.hooks).flat().flatMap(m=>m.hooks).filter(h=>/\.claude\/hooks\/.+\.mjs/.test(h.command)).length;if(n<7)process.exit(1);console.log('hooks',n)"
