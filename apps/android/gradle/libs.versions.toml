[versions]
agp = "9.4.1"
kotlin = "2.4.20"
# Last BOM whose Compose UI (1.11.x) still compiles against compileSdk 36; BOM 2026.08+ (UI 1.12) needs compileSdk 37.
composeBom = "2026.06.01"
activityCompose = "1.13.0"
# :latency only (instrumentation on Firebase Test Lab / emulator).
androidxTestRunner = "1.7.0"
junit = "4.13.2"
# EncryptedSharedPreferences cho token thiết bị (spec 020); P2-05 chuyển sang DataStore + Tink.
securityCrypto = "1.1.0"
# Chỉ cho test JVM: android.jar chỉ có bản stub của org.json.
orgJson = "20250517"

# Spec 022: hàng đợi sự kiện (Room) mã hóa bằng Tink AEAD, gửi lại bằng WorkManager. KSP cho Room compiler.
room = "2.8.5"
tink = "1.23.0"
workManager = "2.12.0"
ksp = "2.3.12"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
