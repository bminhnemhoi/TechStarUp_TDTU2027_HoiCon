# RAM máy dev rất hạn chế (~1–3 GB trống): heap Gradle nhỏ, biên dịch Kotlin ngay trong daemon Gradle
# (không mở thêm Kotlin daemon), daemon tự tắt sau 15 phút rảnh để nhả RAM cho máy ảo.
# JDK 21 cho Gradle đặt ở GRADLE_USER_HOME (D:\.gradle\gradle.properties), KHÔNG đặt org.gradle.java.home ở đây.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=900000
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
